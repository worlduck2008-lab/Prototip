      - name: Install dependencies
        run: npm install
        working-directory: ./zhdem-mishu-github

      # ✅ Шаг сборки: убедитесь, что команда верная для вашего проекта
      - name: Build web assets
        run: npm run build # <-- Если проект на Ionic, замените на: npx ionic build
        working-directory: ./zhdem-mishu-github

      - name: Add and Sync Android Platform
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
        working-directory: ./zhdem-mishu-github
